<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
    <title id="t">Search @ thechelsuk</title>
    <desc id="d">Fast search routing with !bangs, @snaps and a shortcut atlas.</desc>
    <defs>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap");
            .sans { font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif; }
            .mono { font-family: "IBM Plex Mono", "SFMono-Regular", monospace; }
        </style>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f6f0e5"/>
            <stop offset="1" stop-color="#efe6d7"/>
        </linearGradient>
        <radialGradient id="glow-blue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(560)">
            <stop offset="0" stop-color="#0a5cff" stop-opacity="0.2"/>
            <stop offset="1" stop-color="#0a5cff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glow-warm" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1200 630) scale(520)">
            <stop offset="0" stop-color="#ff6b2c" stop-opacity="0.2"/>
            <stop offset="1" stop-color="#ff6b2c" stop-opacity="0"/>
        </radialGradient>
        <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
            <path d="M32 0H0V32" fill="none" stroke="#171516" stroke-opacity="0.05" stroke-width="1"/>
        </pattern>
        <linearGradient id="grid-fade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="1"/>
            <stop offset="0.85" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <mask id="grid-mask">
            <rect width="1200" height="630" fill="url(#grid-fade)"/>
        </mask>
        <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="630">
            <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#211912" flood-opacity="0.18"/>
        </filter>
    </defs>

    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#glow-blue)"/>
    <rect width="1200" height="630" fill="url(#glow-warm)"/>
    <rect width="1200" height="630" fill="url(#grid)" mask="url(#grid-mask)"/>

    <!-- Mark (favicon.svg scaled x4) -->
    <rect x="80" y="80" width="256" height="256" rx="56" fill="#171516" filter="url(#shadow)"/>
    <g transform="translate(80 80) scale(4)">
        <rect width="64" height="64" rx="14" fill="#171516"/>
        <path d="M38.5 38.5 50 50" stroke="#ff6b2c" stroke-width="7.5" stroke-linecap="round"/>
        <circle cx="28" cy="28" r="14.5" fill="#0a5cff" stroke="#f3ecde" stroke-width="5.5"/>
        <rect x="25.75" y="18.5" width="4.5" height="12" rx="2.25" fill="#f3ecde"/>
        <circle cx="28" cy="35.75" r="2.6" fill="#f3ecde"/>
    </g>

    <!-- Wordmark -->
    <text class="sans" x="400" y="190" font-size="124" font-weight="700" fill="#171516" letter-spacing="-4">Search<tspan dx="8" dy="-52" font-size="64" fill="#ff6b2c">*</tspan></text>
    <text class="sans" x="404" y="262" font-size="52" font-weight="500" fill="#615851" letter-spacing="-1">@ thechelsuk</text>

    <!-- Tagline -->
    <text class="sans" x="80" y="428" font-size="36" font-weight="500" fill="#171516" letter-spacing="-0.5">Fast search routing with bangs, snaps and a shortcut atlas.</text>

    <!-- Example chips -->
    <g class="mono" font-size="28" font-weight="600">
        <rect x="80" y="476" width="312" height="64" rx="32" fill="#fffdf8" stroke="#171516" stroke-opacity="0.12"/>
        <text x="110" y="518" fill="#0a5cff">!yt<tspan fill="#171516" font-weight="500"> ambient mix</tspan></text>

        <rect x="412" y="476" width="362" height="64" rx="32" fill="#fffdf8" stroke="#171516" stroke-opacity="0.12"/>
        <text x="442" y="518" fill="#0b8f77">@reddit.com<tspan fill="#171516" font-weight="500"> python</tspan></text>
    </g>

    <!-- URL -->
    <text class="mono" x="1120" y="518" font-size="26" font-weight="500" fill="#615851" text-anchor="end">search.thechels.uk</text>

    <!-- Accent bar -->
    <rect x="0" y="618" width="400" height="12" fill="#0a5cff"/>
    <rect x="400" y="618" width="400" height="12" fill="#0b8f77"/>
    <rect x="800" y="618" width="400" height="12" fill="#ff6b2c"/>
</svg>
